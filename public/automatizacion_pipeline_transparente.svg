<?xml version="1.0" encoding="UTF-8"?>
<svg width="1600" height="900" viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#9CB8E8" flood-opacity="0.28"/>
    </filter>

    <linearGradient id="pathGrad" x1="210" y1="650" x2="1360" y2="430" gradientUnits="userSpaceOnUse">
      <stop stop-color="#9CC7FF"/>
      <stop offset="0.55" stop-color="#5D8EF5"/>
      <stop offset="1" stop-color="#2F6DE7"/>
    </linearGradient>

    <linearGradient id="panelGrad" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.88"/>
      <stop offset="1" stop-color="#ECF4FF" stop-opacity="0.76"/>
    </linearGradient>

    <linearGradient id="blueGlow" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#8FD0FF"/>
      <stop offset="1" stop-color="#2F6DE7"/>
    </linearGradient>

    <linearGradient id="boxGrad" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F4D5B6"/>
      <stop offset="1" stop-color="#D6A87E"/>
    </linearGradient>

    <linearGradient id="boxSide" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#D2A07A"/>
      <stop offset="1" stop-color="#B17C57"/>
    </linearGradient>

    <style>
      .title { font: 700 70px Inter, Arial, sans-serif; fill: #18345D; }
      .title2 { font: 700 70px Inter, Arial, sans-serif; fill: #2F6DE7; }
      .subtitle { font: 400 26px Inter, Arial, sans-serif; fill: #6983A8; letter-spacing: 1px; }
      .label { font: 600 28px Inter, Arial, sans-serif; fill: #5977A8; letter-spacing: 2px; }
      .small { font: 500 20px Inter, Arial, sans-serif; fill: #7B90B4; }
    </style>
  </defs>

  <!-- decorative tech lines -->
  <g opacity="0.16" stroke="#87A8E5" stroke-width="2">
    <path d="M1130 760 C1190 740 1240 740 1310 770"/>
    <path d="M840 220 C960 180 1110 180 1210 240"/>
    <path d="M250 740 C340 780 430 790 530 760"/>
    <circle cx="1260" cy="773" r="5" fill="#87A8E5"/>
    <circle cx="1210" cy="240" r="5" fill="#87A8E5"/>
    <circle cx="525" cy="760" r="5" fill="#87A8E5"/>
  </g>

  <!-- title block -->
  <g transform="translate(90 160)">
    <g transform="translate(0 -44)">
      <rect x="0" y="0" width="42" height="42" rx="10" fill="#EAF2FF"/>
      <path d="M11 20 L18 27 L31 13" stroke="#2F6DE7" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M31 8 H38 V15" stroke="#8AB8FF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
    <text x="0" y="80" class="title">Automatización</text>
    <text x="0" y="176" class="title">de </text>
    <text x="105" y="176" class="title2">Procesos</text>
    <rect x="0" y="220" width="90" height="10" rx="5" fill="#2F6DE7" opacity="0.92"/>
    <text x="0" y="280" class="subtitle">Pipeline visual • fondo transparente • SVG editable</text>
  </g>

  <!-- main path -->
  <path d="M170 690 C310 620 360 620 475 665 C585 708 645 706 760 650 C885 588 985 578 1090 622 C1185 662 1265 642 1380 520"
        stroke="url(#pathGrad)" stroke-width="24" stroke-linecap="round" opacity="0.18"/>
  <path d="M170 690 C310 620 360 620 475 665 C585 708 645 706 760 650 C885 588 985 578 1090 622 C1185 662 1265 642 1380 520"
        stroke="url(#pathGrad)" stroke-width="10" stroke-dasharray="14 16" stroke-linecap="round"/>

  <!-- box -->
  <g transform="translate(175 600)" filter="url(#cardShadow)">
    <ellipse cx="96" cy="138" rx="108" ry="28" fill="#BBD1F6" opacity="0.24"/>
    <rect x="0" y="30" width="192" height="120" rx="18" fill="url(#boxGrad)"/>
    <path d="M0 30 L96 0 L192 30 L96 60 Z" fill="#F8DFC7"/>
    <path d="M192 30 V150 L96 180 V60 Z" fill="url(#boxSide)"/>
    <path d="M96 0 V60" stroke="#A56E4A" stroke-width="5" opacity="0.65"/>
    <path d="M74 12 H118" stroke="#A56E4A" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M86 12 V42" stroke="#A56E4A" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <rect x="116" y="104" width="18" height="18" rx="3" stroke="#7E8FA9" stroke-width="3" opacity="0.85"/>
    <path d="M24 102 h18 m-18 10 h18" stroke="#7E8FA9" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- process nodes -->
  <g transform="translate(510 560)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="120" rx="88" ry="22" fill="#BBD1F6" opacity="0.24"/>
    <circle cx="0" cy="90" r="62" fill="url(#panelGrad)" stroke="#D9E7FF"/>
    <circle cx="0" cy="90" r="54" fill="#FFFFFF" opacity="0.72"/>
    <circle cx="0" cy="90" r="48" stroke="#B7CFFF" stroke-width="2" opacity="0.6"/>
    <path d="M-8 44 L-8 28 M8 44 L8 28 M-39 90 h-16 M55 90 h-16 M-30 58 l-10 -10 M30 58 l10 -10 M-30 122 l-10 10 M30 122 l10 10"
          stroke="#6D8EEA" stroke-width="6" stroke-linecap="round"/>
    <circle cx="0" cy="90" r="26" fill="none" stroke="#2F6DE7" stroke-width="8"/>
  </g>
  <text x="430" y="510" class="label">CAPTURA</text>

  <g transform="translate(760 500)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="160" rx="88" ry="22" fill="#BBD1F6" opacity="0.24"/>
    <circle cx="0" cy="126" r="62" fill="url(#panelGrad)" stroke="#D9E7FF"/>
    <circle cx="0" cy="126" r="54" fill="#FFFFFF" opacity="0.72"/>
    <path d="M-28 126 h56 M-12 106 l24 20 l-24 20" stroke="#2F6DE7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M-44 92 C-62 105 -62 147 -44 160 M44 92 C62 105 62 147 44 160" stroke="#8DB7FF" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>
  <text x="662" y="772" class="label">TRANSFORMACIÓN</text>

  <g transform="translate(1035 505)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="160" rx="88" ry="22" fill="#BBD1F6" opacity="0.24"/>
    <circle cx="0" cy="126" r="62" fill="url(#panelGrad)" stroke="#D9E7FF"/>
    <circle cx="0" cy="126" r="54" fill="#FFFFFF" opacity="0.72"/>
    <path d="M-30 124 L-5 149 L36 101" stroke="#2F6DE7" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="-36" y="86" width="72" height="80" rx="16" stroke="#A9C7FF" stroke-width="4" opacity="0.8"/>
  </g>
  <text x="955" y="790" class="label">VALIDACIÓN</text>

  <g transform="translate(1270 450)" filter="url(#cardShadow)">
    <ellipse cx="0" cy="195" rx="88" ry="22" fill="#BBD1F6" opacity="0.24"/>
    <circle cx="0" cy="155" r="62" fill="url(#panelGrad)" stroke="#D9E7FF"/>
    <circle cx="0" cy="155" r="54" fill="#FFFFFF" opacity="0.72"/>
    <rect x="-34" y="115" width="68" height="54" rx="10" fill="#F5FAFF" stroke="#B7CFFF"/>
    <rect x="-22" y="126" width="12" height="32" rx="4" fill="#A3C5FF"/>
    <rect x="-2" y="120" width="12" height="38" rx="4" fill="#7DAEFA"/>
    <rect x="18" y="134" width="12" height="24" rx="4" fill="#2F6DE7"/>
  </g>
  <text x="1188" y="330" class="label">RESULTADOS</text>

  <!-- robotic arm -->
  <g transform="translate(915 250)" opacity="0.95">
    <ellipse cx="130" cy="188" rx="120" ry="26" fill="#BBD1F6" opacity="0.18"/>
    <rect x="88" y="168" width="84" height="26" rx="13" fill="#E8F1FF" stroke="#C8DBFF"/>
    <circle cx="120" cy="145" r="20" fill="#D8E8FF" stroke="#9DBEF6" stroke-width="4"/>
    <path d="M120 145 L162 108" stroke="#9DBEF6" stroke-width="16" stroke-linecap="round"/>
    <circle cx="162" cy="108" r="16" fill="#D8E8FF" stroke="#9DBEF6" stroke-width="4"/>
    <path d="M162 108 L197 75" stroke="#7FA7F6" stroke-width="14" stroke-linecap="round"/>
    <circle cx="197" cy="75" r="13" fill="#D8E8FF" stroke="#7FA7F6" stroke-width="4"/>
    <path d="M197 75 L220 96" stroke="#6E97F1" stroke-width="10" stroke-linecap="round"/>
    <path d="M197 75 L187 105" stroke="#6E97F1" stroke-width="10" stroke-linecap="round"/>
    <circle cx="217" cy="98" r="5" fill="#2F6DE7" filter="url(#softGlow)"/>
  </g>

  <!-- dotted guide lines -->
  <g stroke="#7FA7F6" stroke-width="3" stroke-linecap="round" stroke-dasharray="4 10" opacity="0.85">
    <path d="M405 630 C455 580 470 575 510 590"/>
    <path d="M575 610 C660 605 698 593 760 565"/>
    <path d="M830 615 C900 650 960 660 1035 625"/>
    <path d="M1095 610 C1178 562 1220 552 1270 570"/>
  </g>

  <!-- small labels -->
  <text x="368" y="700" class="small">Caja / input</text>
  <text x="868" y="220" class="small">Automatización</text>
  <text x="1155" y="625" class="small">Salida lista</text>
</svg>
